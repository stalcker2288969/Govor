name: govor

services:
  api:
    image: ${GOVOR_IMAGE:?Set GOVOR_IMAGE to the published image digest}
    restart: unless-stopped
    env_file:
      - /opt/govor/shared/runtime.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      - type: bind
        source: /opt/govor/data/logs
        target: /app/logs
        bind:
          create_host_path: false
      - type: bind
        source: /opt/govor/data/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/server/ready"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      GOVOR_DOMAIN: ${GOVOR_DOMAIN:?Set GOVOR_DOMAIN in shared/deploy.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
